<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Actor-Critic policy and value learning loop">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#202124"/>
    </marker>
    <style>
      .box { fill:#f7f8fa; stroke:#202124; stroke-width:2; }
      .signal { fill:#eef5f0; stroke:#202124; stroke-width:2; }
      .title { font:700 30px Arial, sans-serif; fill:#161718; }
      .head { font:700 24px Arial, sans-serif; fill:#161718; }
      .body { font:19px Arial, sans-serif; fill:#303236; }
      .math { font:22px "Times New Roman", serif; fill:#161718; }
      .line { stroke:#202124; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#4f5357; stroke-width:2.2; fill:none; stroke-dasharray:8 6; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="700" fill="#fff"/>
  <text x="700" y="52" text-anchor="middle" class="title">Actor-Critic: policy improvement guided by value estimation</text>

  <rect x="90" y="125" width="290" height="145" rx="6" class="box"/>
  <text x="235" y="172" text-anchor="middle" class="head">Actor</text>
  <text x="235" y="212" text-anchor="middle" class="math">πθ(a | s)</text>
  <text x="235" y="244" text-anchor="middle" class="body">selects an action</text>

  <rect x="555" y="125" width="290" height="145" rx="6" class="box"/>
  <text x="700" y="172" text-anchor="middle" class="head">Environment</text>
  <text x="700" y="212" text-anchor="middle" class="math">(st, at) → (rt+1, st+1)</text>
  <text x="700" y="244" text-anchor="middle" class="body">produces experience</text>

  <rect x="1020" y="125" width="290" height="145" rx="6" class="box"/>
  <text x="1165" y="172" text-anchor="middle" class="head">Critic</text>
  <text x="1165" y="212" text-anchor="middle" class="math">Vw(s) or Qw(s,a)</text>
  <text x="1165" y="244" text-anchor="middle" class="body">estimates expected value</text>

  <path d="M380 198 L552 198" class="line"/>
  <text x="466" y="181" text-anchor="middle" class="body">selected action</text>
  <path d="M845 198 L1017 198" class="line"/>
  <text x="931" y="181" text-anchor="middle" class="body">transition sample</text>

  <rect x="980" y="360" width="370" height="115" rx="6" class="signal"/>
  <text x="1165" y="402" text-anchor="middle" class="head">Learning signal</text>
  <text x="1165" y="443" text-anchor="middle" class="math">δt = rt+1 + γVw(st+1) − Vw(st)</text>
  <path d="M1165 270 L1165 357" class="line"/>

  <rect x="320" y="525" width="760" height="105" rx="6" class="box"/>
  <text x="700" y="565" text-anchor="middle" class="head">Actor update</text>
  <text x="700" y="605" text-anchor="middle" class="math">θ ← θ + α ∇θ log πθ(at | st) δt</text>

  <path d="M980 432 C900 455 850 488 825 522" class="line"/>
  <path d="M320 578 C180 558 150 400 215 273" class="dash"/>
  <text x="84" y="416" class="body">updated policy</text>
</svg>
