<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Deep Q-learning dataflow with replay buffer target network loss and gradient update">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#1f2933"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #111827; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #374151; }
      .band { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #111827; stroke-width: 1.8; }
      .data { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.8; }
      .target { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; }
      .loss { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
      .line { stroke: #1f2933; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4b5563; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="640" y="58" class="title" text-anchor="middle">Deep Q-learning dataflow</text>

  <rect x="55" y="98" width="1170" height="150" rx="8" class="band"/>
  <text x="82" y="130" class="small">Collect and store experience</text>

  <rect x="85" y="155" width="170" height="70" rx="7" class="node"/>
  <text x="170" y="184" class="heading" text-anchor="middle">Environment</text>
  <text x="170" y="209" class="small" text-anchor="middle">transitions</text>

  <rect x="320" y="148" width="190" height="84" rx="7" class="data"/>
  <text x="415" y="181" class="heading" text-anchor="middle">Replay buffer</text>
  <text x="415" y="207" class="small" text-anchor="middle">stored experience</text>

  <rect x="575" y="155" width="170" height="70" rx="7" class="data"/>
  <text x="660" y="184" class="heading" text-anchor="middle">Mini-batch</text>
  <text x="660" y="209" class="small" text-anchor="middle">sampled data</text>

  <path d="M255 190 L317 190" class="line"/>
  <path d="M510 190 L572 190" class="line"/>

  <rect x="55" y="285" width="1170" height="335" rx="8" class="band"/>
  <text x="82" y="318" class="small">Compute the online prediction and the delayed target, then compare them.</text>

  <rect x="155" y="355" width="200" height="82" rx="7" class="node"/>
  <text x="255" y="388" class="heading" text-anchor="middle">Main network</text>
  <text x="255" y="414" class="small" text-anchor="middle">current estimate</text>

  <rect x="450" y="355" width="185" height="82" rx="7" class="node"/>
  <text x="542" y="388" class="heading" text-anchor="middle">Prediction</text>
  <text x="542" y="414" class="small" text-anchor="middle">online value</text>

  <rect x="155" y="520" width="200" height="76" rx="7" class="target"/>
  <text x="255" y="551" class="heading" text-anchor="middle">Target network</text>
  <text x="255" y="576" class="small" text-anchor="middle">delayed copy</text>

  <rect x="450" y="520" width="185" height="76" rx="7" class="target"/>
  <text x="542" y="551" class="heading" text-anchor="middle">TD target</text>
  <text x="542" y="576" class="small" text-anchor="middle">bootstrapped value</text>

  <rect x="875" y="420" width="185" height="100" rx="7" class="loss"/>
  <text x="968" y="459" class="heading" text-anchor="middle">Loss</text>
  <text x="968" y="488" class="small" text-anchor="middle">prediction error</text>

  <path d="M660 225 L660 300 L542 300 L542 352" class="line"/>

  <path d="M660 225 L710 225 L710 492 L542 492 L542 517" class="line"/>

  <path d="M355 396 L447 396" class="line"/>
  <path d="M355 558 L447 558" class="line"/>
  <path d="M635 396 L872 450" class="line"/>
  <path d="M635 558 L872 492" class="line"/>

  <path d="M968 420 L968 78 L60 78 L60 396 L152 396" class="line"/>
  <text x="610" y="92" class="small" text-anchor="middle">gradient update</text>

  <path d="M255 438 L255 517" class="dash"/>
  <text x="425" y="482" class="small" text-anchor="middle">periodic parameter copy</text>
</svg>
