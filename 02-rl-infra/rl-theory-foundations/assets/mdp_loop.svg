<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Agent environment interaction in a Markov decision process">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#202124"/>
    </marker>
    <style>
      .box { fill:#f7f8fa; stroke:#202124; stroke-width:2; }
      .return { fill:#eef5f0; stroke:#202124; stroke-width:2; }
      .title { font:700 30px Arial, sans-serif; fill:#161718; }
      .head { font:700 25px Arial, sans-serif; fill:#161718; }
      .body { font:19px Arial, sans-serif; fill:#303236; }
      .math { font:23px "Times New Roman", serif; fill:#161718; }
      .line { stroke:#202124; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="700" fill="#fff"/>
  <text x="700" y="55" text-anchor="middle" class="title">Agent-environment interaction as an MDP</text>

  <rect x="115" y="190" width="370" height="180" rx="6" class="box"/>
  <text x="300" y="244" text-anchor="middle" class="head">Agent</text>
  <text x="300" y="291" text-anchor="middle" class="math">At ∼ π(· | St)</text>
  <text x="300" y="330" text-anchor="middle" class="body">The policy chooses an action.</text>

  <rect x="915" y="190" width="370" height="180" rx="6" class="box"/>
  <text x="1100" y="244" text-anchor="middle" class="head">Environment</text>
  <text x="1100" y="291" text-anchor="middle" class="math">(St+1, Rt+1) ∼ p(· | St, At)</text>
  <text x="1100" y="330" text-anchor="middle" class="body">Dynamics produce the next observation.</text>

  <path d="M485 242 L912 242" class="line"/>
  <text x="700" y="218" text-anchor="middle" class="body">action</text>
  <path d="M915 330 L488 330" class="line"/>
  <text x="700" y="365" text-anchor="middle" class="body">next state and reward</text>

  <rect x="430" y="500" width="540" height="115" rx="6" class="return"/>
  <text x="700" y="542" text-anchor="middle" class="head">Long-term objective</text>
  <text x="700" y="585" text-anchor="middle" class="math">Gt = Rt+1 + γRt+2 + γ²Rt+3 + ···</text>
  <path d="M1100 373 C1080 455 970 515 973 555" class="line"/>
  <text x="1030" y="466" class="body">rewards accumulate</text>
</svg>
