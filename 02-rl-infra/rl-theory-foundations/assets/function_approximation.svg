<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="From tabular value lookup to function approximation">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#1f2933"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #374151; }
      .panel { fill: #f8fafc; stroke: #111827; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #111827; stroke-width: 1.7; }
      .soft { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.7; }
      .accent { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.7; }
      .cell { fill: #ffffff; stroke: #111827; stroke-width: 1.3; }
      .line { stroke: #1f2933; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4b5563; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="640" y="58" class="title" text-anchor="middle">From table lookup to function approximation</text>

  <rect x="70" y="115" width="430" height="405" rx="8" class="panel"/>
  <text x="110" y="162" class="heading">Tabular value</text>
  <text x="110" y="195" class="small">Each state or action pair owns</text>
  <text x="110" y="218" class="small">an independent entry.</text>

  <g transform="translate(115,235)">
    <rect x="0" y="0" width="110" height="48" class="cell"/>
    <rect x="110" y="0" width="110" height="48" class="cell"/>
    <rect x="220" y="0" width="110" height="48" class="cell"/>
    <rect x="0" y="48" width="110" height="72" class="cell"/>
    <rect x="110" y="48" width="110" height="72" class="cell"/>
    <rect x="220" y="48" width="110" height="72" class="cell"/>
    <text x="55" y="31" class="label" text-anchor="middle">State 1</text>
    <text x="165" y="31" class="label" text-anchor="middle">State 2</text>
    <text x="275" y="31" class="label" text-anchor="middle">State 3</text>
    <text x="55" y="91" class="heading" text-anchor="middle">0.6</text>
    <text x="165" y="91" class="heading" text-anchor="middle">0.2</text>
    <text x="275" y="91" class="heading" text-anchor="middle">0.9</text>
  </g>

  <rect x="120" y="395" width="320" height="70" rx="6" class="accent"/>
  <text x="280" y="426" class="label" text-anchor="middle">Changing one entry affects</text>
  <text x="280" y="452" class="label" text-anchor="middle">only that entry.</text>

  <path d="M520 318 L705 318" class="line"/>
  <text x="612" y="286" class="label" text-anchor="middle">share parameters</text>
  <text x="612" y="347" class="small" text-anchor="middle">generalize across states</text>

  <rect x="730" y="115" width="480" height="405" rx="8" class="panel"/>
  <text x="770" y="162" class="heading">Parameterized function</text>
  <text x="770" y="195" class="small">A shared model maps state information to an estimate.</text>

  <rect x="775" y="258" width="130" height="86" rx="7" class="soft"/>
  <text x="840" y="293" class="label" text-anchor="middle">State</text>
  <text x="840" y="320" class="small" text-anchor="middle">features</text>

  <rect x="955" y="248" width="150" height="106" rx="7" class="node"/>
  <text x="1030" y="287" class="label" text-anchor="middle">Model</text>
  <text x="1030" y="314" class="small" text-anchor="middle">with shared</text>
  <text x="1030" y="337" class="small" text-anchor="middle">parameters</text>

  <rect x="960" y="408" width="140" height="58" rx="7" class="accent"/>
  <text x="1030" y="443" class="label" text-anchor="middle">Parameters</text>
  <path d="M1030 408 L1030 358" class="dash"/>

  <rect x="1120" y="263" width="80" height="76" rx="7" class="soft"/>
  <text x="1160" y="294" class="label" text-anchor="middle">Value</text>
  <text x="1160" y="320" class="small" text-anchor="middle">estimate</text>

  <path d="M905 301 L952 301" class="line"/>
  <path d="M1105 301 L1117 301" class="line"/>

  <text x="970" y="482" class="small" text-anchor="middle">One update can move many nearby estimates together.</text>
</svg>
