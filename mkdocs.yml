site_name: Learning LLM Infra
site_description: LLM Infra、RL Infra 与底层系统工程学习笔记
site_author: Learning LLM Infra
repo_name: leaning_llm_infra
docs_dir: docs
site_dir: site
use_directory_urls: true

nav:
  - 首页: README.md
  - 基础能力:
      - 概览: 00-foundations/README.md
      - GPU 架构:
          - 导览: 00-foundations/gpu-architecture/README.md
          - CUDA 编程模型与 GPU 计算系统综述: 00-foundations/gpu-architecture/cuda_intro.md
          - NVIDIA GPU 架构演进: 00-foundations/gpu-architecture/nvidia_gpu_architecture_evolution.md
          - CUDA 示例: 00-foundations/gpu-architecture/examples/README.md
  - 大模型基础设施:
      - 概览: 01-llm-infra/README.md
  - 强化学习基础设施:
      - 概览: 02-rl-infra/README.md
      - 强化学习基础理论: 02-rl-infra/rl-theory-foundations/rl_theory_foundations.md

exclude_docs: |
  .agents/
  .git/
  .github/
  requirements.txt
  mkdocs.yml

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang:
        - zh
        - en
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      timezone: UTC
      fallback_to_build_date: true
  - minify:
      minify_html: true

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/extra.css
