<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-label="KV cache attention and block table path">
  <rect width="1160" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#243041"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; font-size: 16px; letter-spacing: 0; }
      .title { font-size: 24px; font-weight: 700; }
      .group-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 13px; fill: #4b5563; }
      .group { fill: none; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .amber { fill: #fffbeb; stroke: #d97706; }
      .purple { fill: #f5f3ff; stroke: #7c3aed; }
      .cache { fill: #f1f5f9; stroke: #64748b; }
      .arrow { stroke: #243041; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <text x="40" y="42" class="title">KV Cache Path: Attention Math to Runtime Blocks</text>
  <text x="40" y="68" class="small">Prefill writes key/value tensors for all prompt tokens; decode appends one token and gathers history through the block table.</text>

  <rect x="50" y="105" width="310" height="390" class="group"/>
  <text x="72" y="134" class="group-title">Layer Computation</text>

  <rect x="85" y="170" width="230" height="62" class="box blue"/>
  <text x="116" y="198" class="label">Hidden States</text>
  <text x="116" y="219" class="small">prompt tokens or new token</text>

  <rect x="85" y="278" width="230" height="78" class="box purple"/>
  <text x="118" y="308" class="label">Q / K / V Projection</text>
  <text x="118" y="331" class="small">linear weights per layer</text>

  <rect x="85" y="408" width="230" height="54" class="box amber"/>
  <text x="118" y="442" class="label">Attention Output</text>

  <path d="M200 234 L200 271" class="arrow"/>
  <path d="M200 358 L200 401" class="arrow"/>

  <rect x="430" y="105" width="310" height="390" class="group"/>
  <text x="452" y="134" class="group-title">Paged KV Runtime State</text>

  <rect x="465" y="165" width="240" height="70" class="box green"/>
  <text x="496" y="194" class="label">KV Cache Blocks</text>
  <text x="496" y="216" class="small">physical pages in GPU memory</text>

  <rect x="465" y="285" width="240" height="82" class="box cache"/>
  <text x="496" y="316" class="label">Block Table</text>
  <text x="496" y="339" class="small">logical block to physical block</text>

  <rect x="465" y="418" width="240" height="52" class="box amber"/>
  <text x="496" y="451" class="label">Gather K / V History</text>

  <path d="M315 317 C360 280, 404 230, 458 205" class="arrow"/>
  <text x="330" y="255" class="small">write K/V</text>
  <path d="M585 238 L585 278" class="arrow"/>
  <path d="M585 370 L585 411" class="arrow"/>
  <path d="M465 445 C410 448, 363 444, 322 434" class="arrow"/>

  <rect x="810" y="105" width="300" height="390" class="group"/>
  <text x="832" y="134" class="group-title">Request Lifecycle</text>

  <rect x="850" y="168" width="220" height="62" class="box blue"/>
  <text x="884" y="197" class="label">Prefill</text>
  <text x="884" y="218" class="small">write prompt K/V blocks</text>

  <rect x="850" y="286" width="220" height="62" class="box green"/>
  <text x="884" y="315" class="label">Decode Step</text>
  <text x="884" y="336" class="small">append one K/V block slot</text>

  <rect x="850" y="414" width="220" height="54" class="box cache"/>
  <text x="884" y="448" class="label">Release / Reuse</text>

  <path d="M960 232 L960 279" class="arrow"/>
  <path d="M960 350 L960 407" class="arrow"/>
  <path d="M705 325 C755 320, 795 300, 843 309" class="arrow dash"/>
  <text x="726" y="292" class="small">allocation decisions</text>
</svg>
