<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-label="Prefill decode iteration timeline">
  <rect width="1160" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#243041"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; font-size: 16px; letter-spacing: 0; }
      .title { font-size: 24px; font-weight: 700; }
      .group-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 13px; fill: #4b5563; }
      .axis { stroke: #243041; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .box { stroke-width: 1.5; rx: 6; }
      .prefill { fill: #eff6ff; stroke: #2563eb; }
      .decode { fill: #ecfdf5; stroke: #059669; }
      .idle { fill: #f1f5f9; stroke: #64748b; }
      .bad { fill: #fff7ed; stroke: #ea580c; }
      .good { fill: #f5f3ff; stroke: #7c3aed; }
      .group { fill: none; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <text x="40" y="42" class="title">Prefill / Decode Iteration Timeline</text>
  <text x="40" y="68" class="small">Chunked prefill turns one long blocking prompt into smaller scheduler-visible work units between decode steps.</text>

  <text x="70" y="125" class="group-title">Without chunking</text>
  <path d="M70 160 L1080 160" class="axis"/>
  <rect x="135" y="132" width="390" height="56" class="box bad"/>
  <text x="255" y="166" class="label">Long Prefill</text>
  <rect x="540" y="132" width="70" height="56" class="box decode"/>
  <text x="558" y="166" class="label">D1</text>
  <rect x="628" y="132" width="70" height="56" class="box decode"/>
  <text x="646" y="166" class="label">D2</text>
  <rect x="716" y="132" width="70" height="56" class="box decode"/>
  <text x="734" y="166" class="label">D3</text>
  <text x="135" y="218" class="small">Decode waits behind a large prefill task, causing visible token jitter.</text>

  <text x="70" y="285" class="group-title">With chunked prefill</text>
  <path d="M70 320 L1080 320" class="axis"/>
  <rect x="135" y="292" width="115" height="56" class="box prefill"/>
  <text x="159" y="326" class="label">P chunk</text>
  <rect x="268" y="292" width="72" height="56" class="box decode"/>
  <text x="287" y="326" class="label">D1</text>
  <rect x="358" y="292" width="115" height="56" class="box prefill"/>
  <text x="382" y="326" class="label">P chunk</text>
  <rect x="491" y="292" width="72" height="56" class="box decode"/>
  <text x="510" y="326" class="label">D2</text>
  <rect x="581" y="292" width="115" height="56" class="box prefill"/>
  <text x="605" y="326" class="label">P chunk</text>
  <rect x="714" y="292" width="72" height="56" class="box decode"/>
  <text x="733" y="326" class="label">D3</text>
  <rect x="804" y="292" width="115" height="56" class="box prefill"/>
  <text x="828" y="326" class="label">P chunk</text>
  <text x="135" y="378" class="small">Decode steps are inserted between prompt chunks, trading some prefill efficiency for smoother TPOT.</text>

  <rect x="160" y="430" width="840" height="78" class="group"/>
  <text x="185" y="460" class="label">Scheduler budget per iteration</text>
  <text x="185" y="486" class="small">Prioritize running decode requests, then fill remaining token budget with prefill chunks while checking KV block capacity.</text>
</svg>
