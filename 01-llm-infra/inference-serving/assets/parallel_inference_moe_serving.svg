<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-label="Parallel inference and MoE serving topology">
  <rect width="1180" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#243041"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; font-size: 16px; letter-spacing: 0; }
      .title { font-size: 24px; font-weight: 700; }
      .group-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 13px; fill: #4b5563; }
      .group { fill: none; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .gpu { fill: #eff6ff; stroke: #2563eb; }
      .stage { fill: #f5f3ff; stroke: #7c3aed; }
      .expert { fill: #ecfdf5; stroke: #059669; }
      .router { fill: #fff7ed; stroke: #ea580c; }
      .cache { fill: #f1f5f9; stroke: #64748b; }
      .arrow { stroke: #243041; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <text x="40" y="42" class="title">Parallel Inference and MoE Serving Topology</text>
  <text x="40" y="68" class="small">Different parallel dimensions split different objects: matrices, layers, sequence context, experts, or replicas.</text>

  <rect x="40" y="105" width="330" height="205" class="group"/>
  <text x="60" y="132" class="group-title">Tensor Parallel inside one layer</text>
  <rect x="70" y="165" width="115" height="68" class="box gpu"/>
  <text x="92" y="193" class="label">GPU 0</text>
  <text x="92" y="214" class="small">weight shard</text>
  <rect x="220" y="165" width="115" height="68" class="box gpu"/>
  <text x="242" y="193" class="label">GPU 1</text>
  <text x="242" y="214" class="small">weight shard</text>
  <path d="M185 199 L213 199" class="arrow"/>
  <path d="M220 246 C178 282, 119 282, 82 244" class="arrow dash"/>
  <text x="106" y="286" class="small">all-reduce / all-gather per layer</text>

  <rect x="425" y="105" width="330" height="205" class="group"/>
  <text x="445" y="132" class="group-title">Pipeline Parallel across layers</text>
  <rect x="455" y="165" width="82" height="68" class="box stage"/>
  <text x="473" y="193" class="label">Stage 1</text>
  <text x="475" y="214" class="small">layers</text>
  <rect x="560" y="165" width="82" height="68" class="box stage"/>
  <text x="578" y="193" class="label">Stage 2</text>
  <text x="580" y="214" class="small">layers</text>
  <rect x="665" y="165" width="62" height="68" class="box stage"/>
  <text x="681" y="193" class="label">...</text>
  <text x="678" y="214" class="small">layers</text>
  <path d="M537 199 L553 199" class="arrow"/>
  <path d="M642 199 L658 199" class="arrow"/>
  <text x="468" y="268" class="small">stage balance matters for decode TPOT</text>

  <rect x="810" y="105" width="330" height="205" class="group"/>
  <text x="830" y="132" class="group-title">Replica Parallel across traffic</text>
  <rect x="840" y="165" width="115" height="68" class="box cache"/>
  <text x="858" y="193" class="label">Replica A</text>
  <text x="858" y="214" class="small">TP group</text>
  <rect x="990" y="165" width="115" height="68" class="box cache"/>
  <text x="1008" y="193" class="label">Replica B</text>
  <text x="1008" y="214" class="small">TP group</text>
  <rect x="915" y="255" width="115" height="36" class="box router"/>
  <text x="940" y="279" class="label">Router</text>
  <path d="M955 255 L905 236" class="arrow"/>
  <path d="M990 255 L1042 236" class="arrow"/>

  <rect x="110" y="365" width="960" height="190" class="group"/>
  <text x="130" y="392" class="group-title">MoE Expert Parallel inside selected layers</text>

  <rect x="145" y="430" width="130" height="70" class="box router"/>
  <text x="177" y="458" class="label">Router</text>
  <text x="165" y="479" class="small">top-k experts</text>

  <rect x="355" y="420" width="115" height="55" class="box expert"/>
  <text x="380" y="453" class="label">Expert 0</text>
  <rect x="500" y="420" width="115" height="55" class="box expert"/>
  <text x="525" y="453" class="label">Expert 1</text>
  <rect x="645" y="420" width="115" height="55" class="box expert"/>
  <text x="670" y="453" class="label">Expert 2</text>
  <rect x="790" y="420" width="115" height="55" class="box expert"/>
  <text x="815" y="453" class="label">Expert 3</text>

  <rect x="355" y="500" width="115" height="34" class="box gpu"/>
  <text x="382" y="522" class="small">GPU rank 0</text>
  <rect x="500" y="500" width="115" height="34" class="box gpu"/>
  <text x="527" y="522" class="small">GPU rank 1</text>
  <rect x="645" y="500" width="115" height="34" class="box gpu"/>
  <text x="672" y="522" class="small">GPU rank 2</text>
  <rect x="790" y="500" width="115" height="34" class="box gpu"/>
  <text x="817" y="522" class="small">GPU rank 3</text>

  <path d="M275 450 C304 410, 320 410, 340 410" class="arrow"/>
  <path d="M340 410 L900 410" class="arrow dash"/>
  <path d="M412 410 L412 413" class="arrow"/>
  <path d="M557 410 L557 413" class="arrow"/>
  <path d="M702 410 L702 413" class="arrow"/>
  <path d="M847 410 L847 413" class="arrow"/>

  <path d="M412 475 L412 493" class="arrow"/>
  <path d="M557 475 L557 493" class="arrow"/>
  <path d="M702 475 L702 493" class="arrow"/>
  <path d="M847 475 L847 493" class="arrow"/>

  <path d="M905 445 C970 452, 990 505, 930 528" class="arrow dash"/>
  <text x="920" y="493" class="small">combine outputs</text>
  <text x="920" y="512" class="small">in token order</text>
</svg>
