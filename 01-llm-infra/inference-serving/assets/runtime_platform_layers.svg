<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-label="LLM serving stack layers from API gateway through platform runtime KV state and observability">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#27313d"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .band { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .api { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .platform { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 6; }
      .runtime { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; rx: 6; }
      .state { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.6; rx: 6; }
      .obs { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.4; rx: 6; }
      .label { font: 600 14px Arial, sans-serif; fill: #111827; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .group-title { font: 700 15px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #27313d; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1240" height="620" fill="#ffffff"/>
  <text class="title" x="42" y="46">LLM Serving Stack: Runtime Is Only One Layer</text>

  <rect class="band" x="44" y="86" width="1152" height="78"/>
  <text class="group-title" x="64" y="116">API and Product Control</text>
  <rect class="api" x="260" y="106" width="170" height="38"/>
  <text class="label" x="294" y="130">API Gateway</text>
  <rect class="api" x="470" y="106" width="170" height="38"/>
  <text class="label" x="510" y="130">Auth / Quota</text>
  <rect class="api" x="680" y="106" width="170" height="38"/>
  <text class="label" x="704" y="130">Streaming API</text>

  <rect class="band" x="44" y="198" width="1152" height="92"/>
  <text class="group-title" x="64" y="228">Platform and Routing Layer</text>
  <rect class="platform" x="210" y="232" width="170" height="38"/>
  <text class="label" x="249" y="256">Ray Serve</text>
  <rect class="platform" x="420" y="232" width="170" height="38"/>
  <text class="label" x="475" y="256">KServe</text>
  <rect class="platform" x="630" y="232" width="170" height="38"/>
  <text class="label" x="672" y="256">Triton</text>
  <rect class="platform" x="840" y="232" width="170" height="38"/>
  <text class="label" x="876" y="256">Custom Router</text>

  <rect class="band" x="44" y="324" width="1152" height="102"/>
  <text class="group-title" x="64" y="354">Runtime / Engine Layer</text>
  <rect class="runtime" x="140" y="365" width="180" height="40"/>
  <text class="label" x="198" y="389">vLLM</text>
  <rect class="runtime" x="365" y="365" width="180" height="40"/>
  <text class="label" x="423" y="389">SGLang</text>
  <rect class="runtime" x="590" y="365" width="180" height="40"/>
  <text class="label" x="631" y="389">TensorRT-LLM</text>
  <rect class="runtime" x="815" y="365" width="180" height="40"/>
  <text class="label" x="864" y="389">TGI / llama.cpp</text>

  <rect class="band" x="44" y="460" width="710" height="96"/>
  <text class="group-title" x="64" y="490">KV State and Storage Layer</text>
  <rect class="state" x="160" y="506" width="170" height="38"/>
  <text class="label" x="202" y="530">KV Blocks</text>
  <rect class="state" x="370" y="506" width="170" height="38"/>
  <text class="label" x="410" y="530">LMCache</text>
  <rect class="state" x="580" y="506" width="130" height="38"/>
  <text class="label" x="619" y="530">Offload</text>

  <rect class="band" x="800" y="460" width="396" height="96"/>
  <text class="group-title" x="820" y="490">Observability and Governance</text>
  <rect class="obs" x="835" y="506" width="150" height="38"/>
  <text class="label" x="866" y="530">Metrics</text>
  <rect class="obs" x="1015" y="506" width="150" height="38"/>
  <text class="label" x="1046" y="530">Release</text>

  <path class="arrow" d="M765 144 V198"/>
  <path class="arrow" d="M765 290 V324"/>
  <path class="arrow" d="M680 426 V460"/>
  <path class="dash" d="M770 385 C870 420, 930 450, 965 506"/>
  <path class="dash" d="M455 426 V506"/>
  <path class="dash" d="M295 270 C295 320, 230 335, 230 365"/>
  <path class="dash" d="M715 270 C715 320, 680 335, 680 365"/>

  <text class="small" x="790" y="184">request flow</text>
  <text class="small" x="785" y="314">selected backend</text>
  <text class="small" x="695" y="452">cache read/write</text>
  <text class="small" x="835" y="445">metrics and control signals</text>
  <text class="small" x="64" y="586">Runtime choices affect GPU execution; platform choices affect deployment, routing, scaling, and governance.</text>
</svg>
