<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-label="Heterogeneous AI compute pipeline with CPU tasks, GPU actors, object store, scheduler, and observability">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#27313d"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .group-title { font: 700 15px Arial, sans-serif; fill: #334155; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; rx: 6; }
      .cpu { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.6; rx: 6; }
      .gpu { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; rx: 6; }
      .store { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 6; }
      .control { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 6; }
      .label { font: 600 14px Arial, sans-serif; fill: #111827; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #27313d; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1120" height="560" fill="#ffffff"/>
  <text class="title" x="40" y="44">Heterogeneous Distributed Computing for AI Infra</text>

  <rect class="group" x="40" y="78" width="250" height="355"/>
  <text class="group-title" x="60" y="106">CPU Task Plane</text>
  <rect class="cpu" x="70" y="132" width="190" height="54"/>
  <text class="label" x="106" y="155">Data Read</text>
  <text class="small" x="102" y="174">files, tables, object storage</text>
  <rect class="cpu" x="70" y="220" width="190" height="54"/>
  <text class="label" x="92" y="243">Preprocessing</text>
  <text class="small" x="102" y="262">parse, tokenize, filter</text>
  <rect class="cpu" x="70" y="308" width="190" height="54"/>
  <text class="label" x="87" y="331">Control Logic</text>
  <text class="small" x="96" y="350">routing, retry, aggregation</text>

  <rect class="group" x="330" y="78" width="250" height="355"/>
  <text class="group-title" x="350" y="106">Ray Runtime Concepts</text>
  <rect class="control" x="360" y="132" width="190" height="54"/>
  <text class="label" x="407" y="155">Scheduler</text>
  <text class="small" x="388" y="174">CPU, GPU, custom resources</text>
  <rect class="store" x="360" y="220" width="190" height="54"/>
  <text class="label" x="403" y="243">Object Store</text>
  <text class="small" x="390" y="262">shared intermediate data</text>
  <rect class="control" x="360" y="308" width="190" height="54"/>
  <text class="label" x="405" y="331">Actors</text>
  <text class="small" x="389" y="350">stateful services and workers</text>

  <rect class="group" x="620" y="78" width="250" height="355"/>
  <text class="group-title" x="640" y="106">GPU Execution Plane</text>
  <rect class="gpu" x="650" y="132" width="190" height="54"/>
  <text class="label" x="683" y="155">Batch Inference</text>
  <text class="small" x="684" y="174">GPU actor replicas</text>
  <rect class="gpu" x="650" y="220" width="190" height="54"/>
  <text class="label" x="683" y="243">Training Step</text>
  <text class="small" x="679" y="262">distributed GPU workers</text>
  <rect class="gpu" x="650" y="308" width="190" height="54"/>
  <text class="label" x="690" y="331">RL Rollout</text>
  <text class="small" x="681" y="350">env CPU, policy GPU</text>

  <rect class="group" x="910" y="78" width="170" height="355"/>
  <text class="group-title" x="930" y="106">Cluster Layer</text>
  <rect class="node" x="935" y="132" width="120" height="54"/>
  <text class="label" x="964" y="155">K8s</text>
  <text class="small" x="958" y="174">pods, nodes</text>
  <rect class="node" x="935" y="220" width="120" height="54"/>
  <text class="label" x="954" y="243">KubeRay</text>
  <text class="small" x="953" y="262">Ray clusters</text>
  <rect class="node" x="935" y="308" width="120" height="54"/>
  <text class="label" x="951" y="331">Autoscaler</text>
  <text class="small" x="947" y="350">capacity and cost</text>

  <rect class="control" x="410" y="470" width="300" height="52"/>
  <text class="label" x="494" y="493">Observability</text>
  <text class="small" x="455" y="512">queue, object spilling, GPU utilization, failures</text>

  <path class="arrow" d="M165 186 V220"/>
  <path class="arrow" d="M165 274 V308"/>
  <path class="arrow" d="M260 247 H360"/>
  <path class="arrow" d="M550 247 H650"/>
  <path class="arrow" d="M550 159 H650"/>
  <path class="arrow" d="M550 335 H650"/>
  <path class="dash" d="M455 186 V220"/>
  <path class="dash" d="M455 274 V308"/>
  <path class="dash" d="M840 159 H935"/>
  <path class="dash" d="M840 247 H935"/>
  <path class="dash" d="M840 335 H935"/>
  <path class="dash" d="M560 362 V470"/>
  <path class="dash" d="M995 362 C930 470, 780 496, 710 496"/>

  <text class="small" x="286" y="238">tasks and objects</text>
  <text class="small" x="584" y="238">scheduled work</text>
  <text class="small" x="869" y="126">deployment substrate</text>
</svg>
